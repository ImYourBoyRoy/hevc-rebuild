name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.16.1"

jobs:
  frontend:
    name: Frontend checks and contract tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Svelte and TypeScript checks
        run: |
          pnpm check
          pnpm check:tsgo
      - name: Build the frontend
        run: pnpm build
      - name: Run frontend contract tests
        run: |
          pnpm test:metadata-matching
          pnpm test:web-shim
          pnpm test:info-tip-css
          pnpm test:modal
          pnpm test:home-help
          pnpm test:library
          pnpm test:rename
          pnpm test:run
          pnpm test:support
          pnpm test:responsive
          pnpm test:performance
          pnpm test:workspace-state
          pnpm test:report-view
          pnpm test:queue-paths
          pnpm test:youtube
          pnpm test:route-golden
      - name: Check the architecture map is current
        working-directory: .
        run: |
          node tools/architecture-map.mjs --check
          node tools/interaction-map.mjs --check
          node tools/interaction-waterfall.mjs --check

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - name: Install media tools for the end-to-end tests
        working-directory: .
        run: sudo apt-get install -y ffmpeg mkvtoolnix mediainfo
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust library tests
        # The synthetic-clip tests (full rebuild, short test, metadata-only,
        # YouTube) drive the real media tools. HEVC_REQUIRE_MEDIA_TOOLS turns a
        # missing tool into a failure so they can never skip silently here.
        env:
          HEVC_REQUIRE_MEDIA_TOOLS: "1"
        run: cargo test --locked --lib
      - name: Check the native binary
        run: cargo check --locked --bin hevc-rebuild-studio
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Headless build (no desktop feature) tests and Clippy
        # The same code without Tauri/webkit/GTK: the server, CLI and MCP must keep building and passing.
        env:
          HEVC_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          cargo test --locked --lib --no-default-features --target-dir target/headless
          cargo clippy --all-targets --locked --no-default-features --target-dir target/headless -- -D warnings
      - name: Headless binary links no GUI libraries
        run: |
          cargo build --locked --no-default-features --target-dir target/headless --bin hevc-rebuild-studio
          ! ldd target/headless/debug/hevc-rebuild-studio | grep -E 'webkit|gtk|soup|javascriptcore|gdk'

  rust-tests-cross-platform:
    # The native-build job below only compiles on Windows and macOS. This one
    # also runs the unit tests there, covering the platform-specific no-overwrite
    # rename and directory-sync code that the Linux job cannot execute. Media-tool
    # integration tests skip when the tools are absent. Advisory until it has been
    # green on both runners; then drop continue-on-error to make it a gate.
    name: Rust unit tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Run Rust library tests
        run: cargo test --locked --lib

  linux-source-installer:
    name: Clean Linux source installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Build and install the native launcher
        run: ./install.sh --assume-yes
      - name: Exercise the installed JSON entry point
        run: $HOME/.local/bin/hevc-rebuild-studio json environment
      - name: Remove only the launcher
        run: |
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/hevc-rebuild-studio"

  native-build:
    name: Native Tauri compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile Tauri without packaging
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.conf.json
