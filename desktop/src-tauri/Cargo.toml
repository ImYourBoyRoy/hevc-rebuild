[package]
name = "hevc-rebuild-studio"
version = "1.4.0"
description = "Cross-platform desktop interface for safe HEVC media rebuilds"
authors = ["Roy Dawson IV <Roy.Dawson.IV@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hevc_rebuild_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.7.4", features = [] }

[dependencies]
tauri = { version = "^2.12.5", features = [] }
tauri-plugin-dialog = "^2.8.4"
tauri-plugin-opener = "^2.7.2"
tauri-plugin-process = "^2.4.0"
tauri-plugin-updater = "^2.14.1"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
regex = "^1.13.1"
rmcp = { version = "^3.8.0", features = ["schemars", "transport-io"] }
reqwest = { version = "^0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "system-proxy"] }
tokio = { version = "^1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
libc = "^0.2.191"
unicode-normalization = "^0.1.26"
toml = "^1.2.0"
sha2 = "^0.11.1"
flate2 = "^1.1.10"
tar = "^0.4.46"
zip = { version = "^9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "^0.42.0"
keyring = "^4.2.0"
interprocess = "^2.4.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
