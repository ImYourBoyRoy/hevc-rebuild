[package]
name = "hevc-rebuild-studio"
version = "1.4.1"
description = "Cross-platform desktop interface for safe HEVC media rebuilds"
authors = ["Roy Dawson IV <Roy.Dawson.IV@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hevc_rebuild_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `desktop` (the default) is the Tauri window, its plugins and the GUI embedded in the executable.
# `cargo build --no-default-features` builds the same executable without them: CLI, JSON actions, stdio MCP
# and `serve` (headless), with no webkit/GTK libraries needed to build or run it.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
    "dep:interprocess",
]

[build-dependencies]
tauri-build = { version = "^2.7.4", features = [] }
embed-resource = "3"

[dependencies]
# The native window and its plugins; optional so the headless server (`--no-default-features`) links no
# webkit/GTK. See the [features] table.
tauri = { version = "^2.12.5", features = [], optional = true }
tauri-plugin-dialog = { version = "^2.8.4", optional = true }
tauri-plugin-opener = { version = "^2.7.2", optional = true }
tauri-plugin-process = { version = "^2.4.0", optional = true }
tauri-plugin-updater = { version = "^2.14.1", optional = true }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
regex = "^1.13.1"
rmcp = { version = "^3.8.0", features = ["schemars", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "^0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "system-proxy"] }
tokio = { version = "^1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "net", "time", "signal"] }
# Headless server mode (`serve`): HTTP, Server-Sent Events, token generation.
axum = { version = "^0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio-stream = { version = "^0.1.17", default-features = false, features = ["sync"] }
getrandom = "^0.3.4"
libc = "^0.2.191"
unicode-normalization = "^0.1.26"
toml = "^1.2.0"
sha2 = "^0.11.1"
flate2 = "^1.1.10"
tar = "^0.4.46"
zip = { version = "^9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "^0.42.0"
keyring = "^4.2.0"
interprocess = { version = "^2.4.7", optional = true }

# Memory, swap, CPU and process-tree sampling off Linux (Linux reads /proc directly).
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "^0.39.3", default-features = false, features = ["system"] }


[dev-dependencies]
tower = { version = "^0.5.3", features = ["util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
